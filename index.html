<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamer Dashboard SOP</title>
    <style>
        :root {
            --bg-color: #0d0d12;
            --card-bg: #1a1a2e;
            --accent: #00f2ff;
            --neon-pink: #ff00ff;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid var(--accent);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
        }

        h1 { text-align: center; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; }
        
        .section { margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        h3 { color: var(--neon-pink); margin-bottom: 10px; }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8em; margin-bottom: 5px; color: #aaa; }
        input {
            width: 100%;
            padding: 10px;
            background: #0f3460;
            border: 1px solid var(--accent);
            border-radius: 5px;
            color: white;
            box-sizing: border-box;
        }

        .check-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
        }
        input[type="checkbox"] { width: auto; margin-right: 15px; accent-color: var(--neon-pink); }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-save { background: var(--accent); color: black; }
        .btn-wa { background: #25d366; color: white; }
        button:hover { opacity: 0.8; transform: scale(1.02); }
    </style>
</head>
<body>

<div class="container">
    <h1>READY TO STREAM?</h1>

    <!-- Kolom Info Game -->
    <div class="section">
        <h3>LIVE INFO</h3>
        <div class="input-group">
            <label>Judul Game</label>
            <input type="text" id="gameTitle" placeholder="Contoh: Mobile Legends">
        </div>
        <div class="input-group">
            <label>Target Viewers</label>
            <input type="number" id="viewers" placeholder="0">
        </div>
        <div class="input-group">
            <label>Jumlah Koin/Gift Target</label>
            <input type="text" id="coins" placeholder="1000 Diamond">
        </div>
    </div>

    <!-- SOP Checklist -->
    <div class="section">
        <h3>TECHNICAL SOP</h3>
        <label class="check-item"><input type="checkbox" class="sop"> Cek Koneksi Internet (LAN/WiFi)</label>
        <label class="check-item"><input type="checkbox" class="sop"> Cek Mic & Audio Mixer</label>
        <label class="check-item"><input type="checkbox" class="sop"> Update Overlay & Title Stream</label>
    </div>

    <div class="section">
        <h3>PERSONAL SOP</h3>
        <label class="check-item"><input type="checkbox" class="sop"> Air Minum Tersedia</label>
        <label class="check-item"><input type="checkbox" class="sop"> Rapikan Latar Belakang & Wajah</label>
        <label class="check-item"><input type="checkbox" class="sop"> Berdoa & Siapkan Mood Positif</label>
    </div>

    <!-- Tombol Aksi -->
    <div class="btn-group">
        <button class="btn-save" onclick="saveData()">SIMPAN</button>
        <button class="btn-wa" onclick="shareWA()">SHARE WA</button>
    </div>
</div>

<script>
    // Fungsi Menyimpan ke LocalStorage (Agar tidak hilang saat refresh)
    function saveData() {
        const data = {
            game: document.getElementById('gameTitle').value,
            viewers: document.getElementById('viewers').value,
            coins: document.getElementById('coins').value
        };
        localStorage.setItem('streamData', JSON.stringify(data));
        alert("Data Berhasil Disimpan di Browser!");
    }

    // Fungsi Share ke WhatsApp
    function shareWA() {
        const game = document.getElementById('gameTitle').value || "-";
        const viewers = document.getElementById('viewers').value || "0";
        const coins = document.getElementById('coins').value || "0";
        
        let text = `*LAPORAN SIAP STREAMING*%0A`;
        text += `🎮 Game: ${game}%0A`;
        text += `👥 Target Viewers: ${viewers}%0A`;
        text += `💰 Target Koin: ${coins}%0A`;
        text += `✅ SOP Teknis & Personal SELESAI. %0A%0A*GASKEUN!*`;

        window.open(`https://wa.me/?text=${text}`, '_blank');
    }

    // Load data otomatis saat dibuka kembali
    window.onload = function() {
        const saved = JSON.parse(localStorage.getItem('streamData'));
        if(saved) {
            document.getElementById('gameTitle').value = saved.game;
            document.getElementById('viewers').value = saved.viewers;
            document.getElementById('coins').value = saved.coins;
        }
    }
</script>

</body>
</html>
