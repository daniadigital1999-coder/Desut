<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamer Command Center</title>
    <style>
        :root {
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.05);
            --border-glass: rgba(255, 255, 255, 0.1);
            --accent: #00d2ff; /* Cyber Blue */
            --accent-2: #3a7bd5;
            --success: #00ff88;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
        }

        body {
            background: radial-gradient(circle at top right, #1a1a2e, var(--bg));
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .dashboard {
            width: 100%;
            max-width: 480px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .status-badge {
            display: inline-block;
            background: rgba(0, 210, 255, 0.1);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 10px;
            border: 1px solid var(--accent);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #currentDate {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .grid-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .input-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 12px;
            transition: 0.3s;
        }

        .input-box:focus-within {
            border-color: var(--accent);
            background: rgba(0, 210, 255, 0.05);
        }

        .input-box label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .input-box input {
            background: none;
            border: none;
            color: white;
            width: 100%;
            font-size: 1rem;
            outline: none;
        }

        .sop-section {
            margin-top: 25px;
        }

        .sop-section h3 {
            font-size: 0.85rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .sop-section h3::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border-glass);
            margin-left: 15px;
        }

        .check-card {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 8px;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .check-card:hover {
            background: rgba(255, 255, 255, 0.07);
        }

        .check-card input[type="checkbox"] {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-glass);
            border-radius: 6px;
            margin-right: 15px;
            cursor: pointer;
            position: relative;
        }

        .check-card input[type="checkbox"]:checked {
            background: var(--accent);
            border-color: var(--accent);
        }

        .check-card input[type="checkbox"]:checked::after {
            content: "✓";
            color: black;
            position: absolute;
            font-size: 14px;
            left: 4px;
            top: -1px;
            font-weight: bold;
        }

        .check-card span {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .check-card input[type="checkbox"]:checked + span {
            color: white;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .btn-save {
            background: white;
            color: black;
        }

        .btn-wa {
            background: var(--success);
            color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        button:active { transform: translateY(0); }
    </style>
</head>
<body>

<div class="dashboard">
    <header>
        <div class="status-badge">PRE-STREAM PROTOCOL</div>
        <h1>STREAM CENTER</h1>
        <div id="currentDate">Minggu, 10 Mei 2026</div>
    </header>

    <div class="grid-info">
        <div class="input-box" style="grid-column: span 2;">
            <label>Current Game Title</label>
            <input type="text" id="gameTitle" placeholder="e.g. Elden Ring">
        </div>
        <div class="input-box">
            <label>Viewer Target</label>
            <input type="number" id="viewers" placeholder="500">
        </div>
        <div class="input-box">
            <label>Goal Koin/Gift</label>
            <input type="text" id="coins" placeholder="5.0K">
        </div>
    </div>

    <div class="sop-section">
        <h3>Technical Check</h3>
        <label class="check-card">
            <input type="checkbox" class="sop"> <span>Connection Stability</span>
        </label>
        <label class="check-card">
            <input type="checkbox" class="sop"> <span>Audio Levels & Gain</span>
        </label>
        <label class="check-card">
            <input type="checkbox" class="sop"> <span>Stream Overlays Ready</span>
        </label>
    </div>

    <div class="sop-section">
        <h3>Personal Prep</h3>
        <label class="check-card">
            <input type="checkbox" class="sop"> <span>Hydration (Water)</span>
        </label>
        <label class="check-card">
            <input type="checkbox" class="sop"> <span>Environment Lighting</span>
        </label>
        <label class="check-card">
            <input type="checkbox" class="sop"> <span>Warm-up & Energy Boost</span>
        </label>
    </div>

    <div class="actions">
        <button class="btn-save" onclick="saveData()">SAVE DATA</button>
        <button class="btn-wa" onclick="shareWA()">SHARE STATUS</button>
    </div>
</div>

<script>
    function displayDate() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('currentDate').innerText = now.toLocaleDateString('id-ID', options);
    }

    function saveData() {
        const data = {
            game: document.getElementById('gameTitle').value,
            viewers: document.getElementById('viewers').value,
            coins: document.getElementById('coins').value
        };
        localStorage.setItem('streamDataPro', JSON.stringify(data));
        alert("System Config Saved.");
    }

    function shareWA() {
        const dateStr = document.getElementById('currentDate').innerText;
        const game = document.getElementById('gameTitle').value || "N/A";
        const viewers = document.getElementById('viewers').value || "0";
        const coins = document.getElementById('coins').value || "0";
        
        let text = `*🚨 LIVE STREAM REPORT*%0A`;
        text += `📅 *Date:* ${dateStr}%0A`;
        text += `🎮 *Game:* ${game}%0A`;
        text += `👥 *Target:* ${viewers} Viewers%0A`;
        text += `💎 *Goal:* ${coins}%0A%0A`;
        text += `✅ _Systems are nominal. Ready to broadcast._`;

        window.open(`https://wa.me/?text=${text}`, '_blank');
    }

    window.onload = function() {
        displayDate();
        const saved = JSON.parse(localStorage.getItem('streamDataPro'));
        if(saved) {
            document.getElementById('gameTitle').value = saved.game;
            document.getElementById('viewers').value = saved.viewers;
            document.getElementById('coins').value = saved.coins;
        }
    }
</script>

</body>
</html>
